version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    # Wait a week after a release before updating, to reduce supply-chain attack risk
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Shanghai
    labels: [dependencies]
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      # The v2.6.0 image on ghcr.io is missing its platform manifests and cannot be pulled
      - dependency-name: ossf/scorecard-action
        versions: ["2.6.0"]
